ci:
  autoupdate_schedule: monthly
# generated by typesafe-i18n (`pnpm typesafe-i18n`)
exclude: ^src/i18n/i18n-[^/]+\.ts$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=700]
        # test fixtures: the recorded api traffic and the screenshot baselines (see README › Testing)
        exclude: ^tests/e2e/(recordings|__screenshots__)/
      - id: check-merge-conflict
  # The prettier and eslint hooks install their own node environment (no `pnpm install` needed,
  # also on pre-commit.ci). Keep the versions in sync with package.json.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.5.3
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.5.3
          - prettier-plugin-svelte@3.4.0
          - prettier-plugin-tailwindcss@0.6.11
          # loaded by prettier-plugin-svelte and through tailwind.config.js
          - svelte@5.33.4
          - tailwindcss@3.4.17
          - '@layerstack/tailwind@1.0.0'
          - '@tailwindcss/typography@0.5.16'
          - tailwindcss-touch@1.0.1
          - postcss@8.5.3
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.27.0
    hooks:
      - id: eslint
        files: \.(js|mjs|ts|svelte)$
        # vendored shadcn-svelte components
        exclude: ^src/lib/components/(ui|table)/
        types: [file]
        args: [--fix]
        additional_dependencies:
          - eslint@9.27.0
          - '@eslint/js@9.27.0'
          - typescript-eslint@8.33.0
          - typescript@5.8.3
          - eslint-plugin-svelte@2.46.1
          - eslint-config-prettier@9.1.0
          - globals@15.15.0
          - svelte@5.33.4
