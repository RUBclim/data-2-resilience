ci:
  autoupdate_schedule: monthly
# src/i18n/i18n-*.ts: generated by typesafe-i18n (`pnpm typesafe-i18n`)
# patches/*.patch: dependency patches (`pnpm patch`); whitespace fixes would break them and the
# hash in pnpm-lock.yaml
exclude: ^(src/i18n/i18n-[^/]+\.ts|patches/.+\.patch)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # pnpm-lock.yaml holds two documents: the pnpm binaries of `packageManager`, then the project
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=700]
        # test fixtures: the recorded api traffic and the screenshot baselines (see README › Testing)
        exclude: ^tests/e2e/(recordings|__screenshots__)/
      - id: check-merge-conflict
  # The prettier and eslint hooks install their own node environment (no `pnpm install` needed,
  # also on pre-commit.ci). Keep the versions in sync with package.json.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.9.10
          - prettier-plugin-svelte@4.1.1
          - prettier-plugin-tailwindcss@0.8.1
          # loaded by prettier-plugin-svelte and through src/app.css (`tailwindStylesheet`)
          - svelte@5.57.2
          - tailwindcss@4.3.3
          - '@tailwindcss/typography@0.5.20'
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.13.0
    hooks:
      - id: eslint
        files: \.(js|mjs|ts|svelte)$
        # vendored shadcn-svelte components
        exclude: ^src/lib/components/ui/
        types: [file]
        args: [--fix]
        additional_dependencies:
          - eslint@10.13.0
          - '@eslint/js@10.0.1'
          - typescript-eslint@8.72.0
          - typescript@6.0.3
          - eslint-plugin-svelte@3.23.1
          - eslint-config-prettier@10.1.8
          - globals@17.13.0
          - svelte@5.57.2
